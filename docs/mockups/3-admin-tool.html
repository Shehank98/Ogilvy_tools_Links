<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.logoprev{display:flex;align-items:center;gap:14px;margin-top:5px}
.tog{display:flex;gap:22px;margin-top:16px}.tog span{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.sw{width:38px;height:22px;border-radius:99px;background:#d1d5db;position:relative}.sw.on{background:#16a34a}.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff}.sw.on::after{left:19px}
.opt{display:flex;gap:12px;padding:14px;border:1.5px solid #e5e7eb;border-radius:12px;margin-top:10px;align-items:flex-start}
.opt.sel{border-color:var(--brand);background:#fff8f7}
.rd{width:20px;height:20px;border-radius:99px;border:2px solid #cbd5e1;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.opt.sel .rd{border-color:var(--brand)}.opt.sel .rd::after{content:"";width:10px;height:10px;border-radius:99px;background:var(--brand)}
.opt b{font-size:14.5px}.opt p{margin:2px 0 0;font-size:13px;color:#6b7280}
.picker{margin-top:14px;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f9fafb;border-bottom:1px solid #e5e7eb}
.ph .in{margin:0;flex:1;min-height:34px;font-size:13.5px}
.mini{font-size:12.5px;font-weight:600;color:#374151;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;background:#fff}
.person{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid #f1f5f9}
.person:last-child{border:0}
.av{width:32px;height:32px;border-radius:99px;background:#e5e7eb;color:#374151;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.person.on .av{background:var(--brand);color:#fff}
.person div{flex:1;min-width:0}.person b{display:block;font-size:14px}.person small{color:#6b7280;font-size:12.5px}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.person.on .cb{background:var(--brand);border-color:var(--brand)}
.count{display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:600}
.save{display:flex;gap:12px;margin-top:20px}
</style></head><body>
<script src="shared.js"></script>
<script>
const t = TOOLS[0];
const people=[['Asha Fernando','asha.f@ogilvy.com',1],['Kim Park','kim.park@ogilvy.com',1],['Ravi Dias','ravi.d@ogilvy.com',0],['Sam Lee','sam.lee@ogilvy.com',1],['Nimali Perera','nimali.p@ogilvy.com',1],['Tharindu Silva','tharindu.s@ogilvy.com',0],['Dilani Jayawardena','dilani.j@ogilvy.com',1],['Chamod Fernando','chamod.f@ogilvy.com',0],['Ishara Weerasinghe','ishara.w@ogilvy.com',1]];
const ini=n=>n.split(' ').map(x=>x[0]).join('');
document.body.insertAdjacentHTML('beforeend', ANAV('Tools') + `<div class="wrap">
 <div style="color:#c4271d;font-weight:600;margin-bottom:10px">← All tools</div>
 <h1 class="serif" style="font-size:26px;margin-bottom:18px">Edit tool · ${t.name}</h1>
 <div class="cols">
  <div class="card">
    <h2>Tool details</h2>
    <label class="f">Name<div class="in">${t.name}</div></label>
    <div class="row2"><label class="f">Link (opens when users click “Open tool”)<div class="in">https://canvas.ogilvy.example/app</div></label><label class="f">Category<div class="in">Media</div></label></div>
    <label class="f">Logo<div class="logoprev">${logo(t,56)}<div class="in" style="flex:1;margin:0">https://…/incremetrics-canvas.png</div><span class="mini">Upload</span></div></label>
    <label class="f">About this tool <span style="font-weight:400;color:#9ca3af">(shown in the pop-up)</span><div class="in" style="min-height:74px;align-items:flex-start">Turns your campaign data into a clear incrementality view in minutes, so you can show what media actually drove results…</div></label>
    <label class="f">What it's for <span style="font-weight:400;color:#9ca3af">(one point per line)</span><div class="in" style="min-height:70px;align-items:flex-start;white-space:pre-line">Measure the true lift of a campaign
Compare channels side by side
Export a client-ready summary</div></label>
    <div class="row2"><label class="f">Initiated by<div class="in">Sandaruwan Perera</div></label><label class="f">Developed by<div class="in">Sandaruwan Perera, Rohan Perera &amp; Shehan Kavishka</div></label></div>
    <label class="f">Team<div class="in">Sachintha Gunawardane, Thusara Ranasinghe, Hasith Dilakshana, …</div></label>
    <label class="f">Advisory team <span style="font-weight:400;color:#9ca3af">(optional)</span><div class="in ph">Leave empty to hide this section</div></label>
    <div class="tog"><span><i class="sw on"></i>Active</span><span><i class="sw"></i>Beta</span></div>
  </div>

  <div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2>Who can see this tool</h2><span class="count">👁 7 of 48 people</span></div>
      <p class="sub">People who aren't allowed won't see this tool on their Tools page at all.</p>
      <div class="opt"><i class="rd"></i><div><b>Everyone</b><p>All signed-in staff (48 people)</p></div></div>
      <div class="opt sel"><i class="rd"></i><div><b>Only selected people</b><p>Choose exactly who gets this tool</p></div></div>
      <div class="picker">
        <div class="ph"><div class="in ph">🔍 Search people…</div><span class="mini">Select all</span><span class="mini">Clear</span></div>
        ${people.map(p=>`<div class="person ${p[2]?'on':''}"><i class="av">${ini(p[0])}</i><div><b>${p[0]}</b><small>${p[1]}</small></div><i class="cb">${p[2]?'✓':''}</i></div>`).join('')}
      </div>
    </div>
    <div class="save"><span class="btn">Save tool</span><span class="btn ghost">Cancel</span></div>
  </div>
 </div></div>`);
</script></body></html>
