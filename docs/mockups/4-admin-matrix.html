<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
.bar{display:flex;gap:12px;align-items:center;margin:16px 0}
.bar .in{margin:0;width:300px;min-height:38px}
.chip{white-space:nowrap;font-size:13px;font-weight:600;border:1px solid #d1d5db;border-radius:99px;padding:7px 14px;background:#fff;color:#4b5563}.chip.on{background:#111;color:#fff;border-color:#111}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
th,td{padding:0;border-bottom:1px solid #f1f5f9;text-align:center}
th{background:#f9fafb;vertical-align:bottom;padding:12px 6px 10px;font-weight:600;font-size:12.5px;color:#374151;border-bottom:2px solid #111}
th:first-child,td:first-child{text-align:left;padding-left:18px;width:260px}
th .logo{width:40px;height:40px;border-radius:11px;margin:0 auto 6px}th .logo svg{width:24px;height:24px}
.ev td{background:#fffaf9;border-bottom:1px solid #fde1dd}
.ev td:first-child{font-weight:700;color:#c4271d}
.sw{display:inline-block;width:34px;height:20px;border-radius:99px;background:#d1d5db;position:relative;vertical-align:middle}.sw.on{background:#16a34a}.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:99px;background:#fff}.sw.on::after{left:17px}
.ck{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;border:2px solid #d1d5db;color:transparent;font-weight:700;font-size:15px}
.ck.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ck.lock{background:#e5e7eb;border-color:#e5e7eb;color:#9ca3af}
.person{display:flex;align-items:center;gap:11px;padding:9px 0}.av{width:32px;height:32px;border-radius:99px;background:#e5e7eb;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;color:#374151}
.person b{display:block;font-size:14px}.person small{color:#6b7280;font-size:12px}
.foot{position:absolute;left:0;right:0;bottom:0;background:#111;color:#fff;display:flex;align-items:center;gap:16px;padding:14px 124px}
.foot .btn{padding:8px 16px}.foot .btn.ghost{background:transparent;color:#fff;border-color:#555}
.legend{white-space:nowrap;display:flex;gap:18px;color:#6b7280;font-size:12.5px;align-items:center}.legend .ck{width:18px;height:18px;font-size:11px;border-radius:5px}
</style></head><body style="position:relative;height:860px;overflow:hidden">
<script src="shared.js"></script>
<script>
const people=[['Asha Fernando','asha.f@ogilvy.com'],['Kim Park','kim.park@ogilvy.com'],['Ravi Dias','ravi.d@ogilvy.com'],['Sam Lee','sam.lee@ogilvy.com'],['Nimali Perera','nimali.p@ogilvy.com'],['Tharindu Silva','tharindu.s@ogilvy.com'],['Dilani Jayawardena','dilani.j@ogilvy.com'],['Chamod Fernando','chamod.f@ogilvy.com']];
const ini=n=>n.split(' ').map(x=>x[0]).join('');
// which tools are open to everyone (locked on), the rest are per-person
const everyone={brief:1,resize:1,copy:1};
const grant={canvas:[0,1,3,4,6],report:[0,2,3,5],media:[1,4,6,7],pitch:[0,1],budget:[2,3,7]};
const cell=(t,i)=>everyone[t.id]?`<span class="ck lock">✓</span>`:`<span class="ck ${grant[t.id].includes(i)?'on':''}">${grant[t.id].includes(i)?'✓':''}</span>`;
document.body.insertAdjacentHTML('beforeend', ANAV('Tool access') + `<div class="wrap" style="padding-bottom:90px">
 <h1 class="serif" style="font-size:26px">Tool access</h1>
 <p class="sub" style="font-size:14px">Choose which people can see which tools. Tick a box to give someone a tool, or switch a tool on for everyone.</p>
 <div class="bar"><div class="in">🔍 Search people…</div><span class="chip on">All people (48)</span><span class="chip">Restricted tools only</span><span class="chip">People with no tools</span>
   <span class="legend" style="margin-left:auto"><span class="ck on">✓</span> has access <span class="ck">&nbsp;</span> no access <span class="ck lock">✓</span> open to everyone</span></div>
 <table>
  <thead><tr><th>Person</th>${TOOLS.map(t=>`<th>${logo(t,40)}${t.short}</th>`).join('')}</tr></thead>
  <tbody>
   <tr class="ev"><td>Visible to everyone</td>${TOOLS.map(t=>`<td><i class="sw ${everyone[t.id]?'on':''}"></i></td>`).join('')}</tr>
   ${people.map((p,i)=>`<tr><td><div class="person"><i class="av">${ini(p[0])}</i><div><b>${p[0]}</b><small>${p[1]}</small></div></div></td>${TOOLS.map(t=>`<td>${cell(t,i)}</td>`).join('')}</tr>`).join('')}
  </tbody>
 </table>
 <div style="margin-top:12px;color:#6b7280;font-size:13px">Showing 8 of 48 people · tools marked “Visible to everyone” are always available to all staff.</div>
</div>
<div class="foot"><b>3 unsaved changes</b><span style="color:#aaa">Kim Park → Pitch Deck AI · Ravi Dias → Media Planner · Pitch Deck AI → 2 people</span><span style="margin-left:auto;display:flex;gap:10px"><span class="btn ghost">Discard</span><span class="btn">Save access</span></span></div>`);
</script></body></html>
